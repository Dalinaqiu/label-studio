---
name: Codespell

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  codespell:
    if: ${{ false }}  # disable for now
    name: Check for spelling errors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Codespell
        uses: codespell-project/actions-codespell@v2
        with:
          skip: "**/3rdpartylicenses.txt,**/package.json,**/package-lock.json"
